<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audit Log Test Console</title>
    <style>
      :root {
        --bg: #f5f5f8;
        --panel-bg: #ffffff;
        --panel-border: #e0e0e0;
        --scenario-bg: #f0f0f8;
        --scenario-border: #d8d8e8;
        --text: #1a1a2e;
        --text-secondary: #888888;
        --heading: #303f9f;
        --brand: #303f9f;
        --active-bg: #303f9f;
        --active-text: #ffffff;
        --inactive-bg: #ffffff;
        --inactive-border: #d0d0d0;
        --inactive-text: #888888;
        --feed-item-bg: #f8f8fc;
        --feed-error-bg: #fff8f8;
        --warning-bg: #fff8e1;
        --warning-border: #ffd54f;
        --warning-text: #e65100;
        --error-bg: #fbe9e7;
        --error-border: #ef9a9a;
        --error-text: #c62828;
        --success-color: #2e7d32;
        --success-border: #4caf50;
        --error-color: #c62828;
        --error-border-color: #ef5350;
        --input-bg: #ffffff;
        --input-border: #d0d0d0;
        --prop-add-color: #303f9f;
        --feed-time: #bbbbbb;
        --feed-detail: #999999;
        --btn-secondary-bg: #f0f0f8;
        --btn-secondary-border: #d8d8e8;
        --btn-secondary-text: #666666;
      }

      body.dark {
        --bg: #12141c;
        --panel-bg: #12102a;
        --panel-border: rgba(255, 255, 255, 0.08);
        --scenario-bg: rgba(255, 255, 255, 0.04);
        --scenario-border: rgba(255, 255, 255, 0.08);
        --text: #e0e0e8;
        --text-secondary: #666666;
        --heading: #8b88c0;
        --brand: #303f9f;
        --active-bg: #1e1a4a;
        --active-text: #c8c6e0;
        --inactive-bg: rgba(255, 255, 255, 0.03);
        --inactive-border: rgba(255, 255, 255, 0.1);
        --inactive-text: #666666;
        --feed-item-bg: rgba(255, 255, 255, 0.03);
        --feed-error-bg: rgba(198, 40, 40, 0.06);
        --warning-bg: rgba(230, 81, 0, 0.1);
        --warning-border: rgba(230, 81, 0, 0.25);
        --warning-text: #ffb74d;
        --error-bg: rgba(198, 40, 40, 0.1);
        --error-border: rgba(198, 40, 40, 0.25);
        --error-text: #ef9a9a;
        --success-color: #81c784;
        --success-border: #4caf50;
        --error-color: #ef9a9a;
        --error-border-color: #ef5350;
        --input-bg: rgba(255, 255, 255, 0.03);
        --input-border: rgba(255, 255, 255, 0.1);
        --prop-add-color: #8b88c0;
        --feed-time: #555555;
        --feed-detail: #666666;
        --btn-secondary-bg: rgba(255, 255, 255, 0.05);
        --btn-secondary-border: rgba(255, 255, 255, 0.1);
        --btn-secondary-text: #888888;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.5;
        transition:
          background 0.3s,
          color 0.3s;
      }

      /* Header */
      header {
        background: #303f9f;
        color: white;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header h1 {
        font-size: 18px;
        font-weight: 600;
      }
      header p {
        font-size: 12px;
        opacity: 0.7;
        margin-top: 2px;
      }
      #theme-toggle {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.2s;
      }
      #theme-toggle:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* Main layout */
      main {
        display: flex;
        min-height: calc(100vh - 100px);
      }

      /* Panels */
      .panel {
        background: var(--panel-bg);
        border-right: 1px solid var(--panel-border);
        padding: 16px;
        transition:
          background 0.3s,
          border-color 0.3s;
      }
      .panel-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--heading);
        margin-bottom: 12px;
      }

      #scenarios-panel {
        flex: 0 0 260px;
        overflow-y: auto;
      }
      #custom-panel {
        flex: 0 0 280px;
        overflow-y: auto;
      }
      #feed-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        border-right: none;
      }

      /* Scenario buttons */
      .scenario-btn {
        display: block;
        width: 100%;
        background: var(--scenario-bg);
        border: 1px solid var(--scenario-border);
        border-radius: 6px;
        cursor: pointer;
        padding: 10px 12px;
        margin-bottom: 6px;
        text-align: left;
        transition: all 0.15s;
      }
      .scenario-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .scenario-btn:active {
        transform: translateY(0);
      }
      .scenario-btn.sending {
        opacity: 0.6;
        pointer-events: none;
      }
      .scenario-btn.sent {
        border-color: var(--success-border);
        background: rgba(76, 175, 80, 0.08);
      }
      .scenario-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        display: block;
      }
      .scenario-meta {
        font-size: 11px;
        color: var(--text-secondary);
        margin-top: 2px;
      }

      .scenario-btn.warning {
        background: var(--warning-bg);
        border-color: var(--warning-border);
      }
      .scenario-btn.warning .scenario-label {
        color: var(--warning-text);
      }

      .scenario-btn.error {
        background: var(--error-bg);
        border-color: var(--error-border);
      }
      .scenario-btn.error .scenario-label {
        color: var(--error-text);
      }

      .scenario-divider {
        border: none;
        border-top: 1px solid var(--panel-border);
        margin: 12px 0;
      }

      /* Bulk generate */
      .bulk-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #bulk-count {
        width: 60px;
        padding: 8px;
        border: 1px solid var(--input-border);
        border-radius: 6px;
        background: var(--input-bg);
        color: var(--text);
        font-size: 13px;
        text-align: center;
      }
      #bulk-btn {
        flex: 1;
        padding: 8px 12px;
        background: var(--active-bg);
        color: var(--active-text);
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.15s;
      }
      #bulk-btn:hover {
        opacity: 0.9;
      }
      #bulk-btn.sending {
        opacity: 0.6;
        pointer-events: none;
      }

      /* Custom panel form */
      .form-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-secondary);
        margin-bottom: 6px;
        margin-top: 14px;
        display: block;
      }
      .form-label:first-of-type {
        margin-top: 0;
      }

      .category-toggle {
        display: flex;
        gap: 4px;
      }
      .category-btn {
        flex: 1;
        padding: 7px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.15s;
        border: 1px solid var(--inactive-border);
        background: var(--inactive-bg);
        color: var(--inactive-text);
      }
      .category-btn.active {
        background: var(--active-bg);
        color: var(--active-text);
        border-color: var(--active-bg);
      }

      #event-type {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--input-border);
        border-radius: 6px;
        background: var(--input-bg);
        color: var(--text);
        font-size: 13px;
        appearance: auto;
      }

      .toggle-group {
        display: flex;
        gap: 4px;
      }
      .toggle-group button {
        flex: 1;
        padding: 7px 8px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
        transition: all 0.15s;
        border: 1px solid var(--inactive-border);
        background: var(--inactive-bg);
        color: var(--inactive-text);
      }
      .toggle-group button.active {
        background: var(--active-bg);
        color: var(--active-text);
        border-color: var(--active-bg);
      }

      /* Custom properties */
      #custom-props {
        margin-top: 4px;
      }
      .prop-row {
        display: flex;
        gap: 4px;
        margin-bottom: 4px;
      }
      .prop-key,
      .prop-value {
        flex: 1;
        padding: 6px 8px;
        border: 1px solid var(--input-border);
        border-radius: 4px;
        background: var(--input-bg);
        color: var(--text);
        font-size: 12px;
      }
      .prop-remove {
        background: none;
        border: none;
        color: var(--error-text);
        cursor: pointer;
        font-size: 16px;
        padding: 0 4px;
        line-height: 1;
      }
      #add-prop {
        background: none;
        border: none;
        color: var(--prop-add-color);
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
        padding: 4px 0;
        margin-top: 4px;
      }
      #add-prop:hover {
        text-decoration: underline;
      }

      #send-custom {
        width: 100%;
        padding: 10px;
        margin-top: 16px;
        background: var(--active-bg);
        color: var(--active-text);
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.15s;
      }
      #send-custom:hover {
        opacity: 0.9;
      }
      #send-custom.sending {
        opacity: 0.6;
        pointer-events: none;
      }

      /* Feed panel */
      .feed-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      #feed-count {
        font-size: 12px;
        color: var(--text-secondary);
      }
      #feed-list {
        flex: 1;
        overflow-y: auto;
      }
      .feed-item {
        padding: 8px 10px;
        margin-bottom: 4px;
        border-radius: 4px;
        background: var(--feed-item-bg);
        transition: background 0.2s;
      }
      .feed-success {
        border-left: 3px solid var(--success-border);
      }
      .feed-error {
        border-left: 3px solid var(--error-border-color);
      }
      .feed-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .feed-status {
        font-size: 13px;
        font-weight: 500;
      }
      .status-success {
        color: var(--success-color);
      }
      .status-error {
        color: var(--error-color);
      }
      .feed-time {
        font-size: 11px;
        color: var(--feed-time);
      }
      .feed-detail {
        font-size: 11px;
        color: var(--feed-detail);
        margin-top: 2px;
      }

      .feed-footer {
        display: flex;
        gap: 8px;
        padding-top: 12px;
        border-top: 1px solid var(--panel-border);
        margin-top: 8px;
      }
      .feed-footer button {
        flex: 1;
        padding: 7px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
        transition: all 0.15s;
        background: var(--btn-secondary-bg);
        border: 1px solid var(--btn-secondary-border);
        color: var(--btn-secondary-text);
      }
      .feed-footer button:hover {
        opacity: 0.8;
      }

      /* Footer */
      footer {
        background: #303f9f;
        color: white;
        padding: 12px 24px;
        text-align: center;
        font-size: 12px;
        opacity: 0.9;
      }
      footer span {
        display: block;
        opacity: 0.6;
        font-size: 11px;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Audit Log Test Console</h1>
        <p>
          Generate events &rarr; App Insights &rarr; Log Analytics &rarr; WORM
          Storage
        </p>
      </div>
      <button id="theme-toggle" title="Toggle dark mode">&#9790; Dark</button>
    </header>

    <main>
      <!-- Left: Scenarios Panel -->
      <div id="scenarios-panel" class="panel">
        <div class="panel-title">Quick Scenarios</div>

        <button
          class="scenario-btn"
          data-category="Audit"
          data-event-type="Login"
          data-severity="Low"
          data-outcome="Succeeded"
        >
          <span class="scenario-label">User Login</span>
          <span class="scenario-meta"
            >Audit &middot; Low &middot; Succeeded</span
          >
        </button>
        <button
          class="scenario-btn"
          data-category="Audit"
          data-event-type="Logout"
          data-severity="Low"
          data-outcome="Succeeded"
        >
          <span class="scenario-label">User Logout</span>
          <span class="scenario-meta"
            >Audit &middot; Low &middot; Succeeded</span
          >
        </button>
        <button
          class="scenario-btn"
          data-category="Audit"
          data-event-type="Consultation"
          data-severity="Low"
          data-outcome="Succeeded"
        >
          <span class="scenario-label">Data Consultation</span>
          <span class="scenario-meta"
            >Audit &middot; Low &middot; Succeeded</span
          >
        </button>
        <button
          class="scenario-btn"
          data-category="Audit"
          data-event-type="Alteration"
          data-severity="Medium"
          data-outcome="Succeeded"
        >
          <span class="scenario-label">Data Modification</span>
          <span class="scenario-meta"
            >Audit &middot; Medium &middot; Succeeded</span
          >
        </button>
        <button
          class="scenario-btn"
          data-category="Audit"
          data-event-type="Erasure"
          data-severity="High"
          data-outcome="Succeeded"
        >
          <span class="scenario-label">Data Erasure</span>
          <span class="scenario-meta"
            >Audit &middot; High &middot; Succeeded</span
          >
        </button>

        <hr class="scenario-divider" />

        <button
          class="scenario-btn warning"
          data-category="Security"
          data-event-type="AuthDenied"
          data-severity="High"
          data-outcome="Blocked"
        >
          <span class="scenario-label">Auth Denied</span>
          <span class="scenario-meta"
            >Security &middot; High &middot; Blocked</span
          >
        </button>
        <button
          class="scenario-btn error"
          data-category="Security"
          data-event-type="SuspiciousInputDetected"
          data-severity="Critical"
          data-outcome="Blocked"
        >
          <span class="scenario-label">Security Incident</span>
          <span class="scenario-meta"
            >Security &middot; Critical &middot; Blocked</span
          >
        </button>
        <button
          class="scenario-btn error"
          data-category="Security"
          data-event-type="InternalError"
          data-severity="Critical"
          data-outcome="Blocked"
        >
          <span class="scenario-label">Internal Error</span>
          <span class="scenario-meta"
            >Security &middot; Critical &middot; Blocked</span
          >
        </button>

        <hr class="scenario-divider" />

        <div class="panel-title">Bulk Generate</div>
        <div class="bulk-row">
          <input type="number" id="bulk-count" value="25" min="1" max="100" />
          <button id="bulk-btn">Bulk Generate</button>
        </div>
      </div>

      <!-- Middle: Custom Event Panel -->
      <div id="custom-panel" class="panel">
        <div class="panel-title">Custom Event</div>

        <label class="form-label">Category</label>
        <div class="category-toggle">
          <button class="category-btn active" data-value="Audit">Audit</button>
          <button class="category-btn" data-value="Security">Security</button>
        </div>

        <label class="form-label">Event Type</label>
        <select id="event-type">
          <optgroup label="Audit Events" data-category="Audit">
            <option value="Consultation">Consultation</option>
            <option value="Combination">Combination</option>
            <option value="Alteration">Alteration</option>
            <option value="Erasure">Erasure</option>
            <option value="Login">Login</option>
            <option value="Logout">Logout</option>
          </optgroup>
          <optgroup
            label="Security Events"
            data-category="Security"
            style="display: none"
          >
            <option value="HighRiskOperationInvolved">
              HighRiskOperationInvolved
            </option>
            <option value="SuspiciousInputDetected">
              SuspiciousInputDetected
            </option>
            <option value="AuthDenied">AuthDenied</option>
            <option value="HighVolumeDataAccess">HighVolumeDataAccess</option>
            <option value="BusinessRuleViolation">BusinessRuleViolation</option>
            <option value="SuspiciousSlowRequest">SuspiciousSlowRequest</option>
            <option value="UnexpectedHttpMethod">UnexpectedHttpMethod</option>
            <option value="InternalError">InternalError</option>
          </optgroup>
        </select>

        <label class="form-label">Severity</label>
        <div id="severity-group" class="toggle-group">
          <button class="active" data-value="Low">Low</button>
          <button data-value="Medium">Medium</button>
          <button data-value="High">High</button>
          <button data-value="Critical">Critical</button>
        </div>

        <label class="form-label">Outcome</label>
        <div id="outcome-group" class="toggle-group">
          <button class="active" data-value="Succeeded">Succeeded</button>
          <button data-value="Blocked">Blocked</button>
        </div>

        <label class="form-label">Custom Properties</label>
        <div id="custom-props"></div>
        <button id="add-prop">+ Add property</button>

        <button id="send-custom">Send Event</button>
      </div>

      <!-- Right: Activity Feed Panel -->
      <div id="feed-panel" class="panel">
        <div class="feed-header">
          <div class="panel-title" style="margin-bottom: 0">Activity Feed</div>
          <span id="feed-count">0 events</span>
        </div>
        <div id="feed-list"></div>
        <div class="feed-footer">
          <button id="clear-feed">Clear</button>
          <button id="export-feed">Export JSON</button>
        </div>
      </div>
    </main>

    <footer>
      Immutable Audit Log Retention &middot; Test Console
      <span>App Insights &rarr; Log Analytics &rarr; WORM Storage</span>
    </footer>

    <script>
      // Theme toggle
      const body = document.body;
      const themeToggle = document.getElementById("theme-toggle");
      if (localStorage.getItem("theme") === "dark") {
        body.classList.add("dark");
        themeToggle.innerHTML = "&#9788; Light";
      }
      themeToggle.addEventListener("click", () => {
        body.classList.toggle("dark");
        const isDark = body.classList.contains("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        themeToggle.innerHTML = isDark ? "&#9788; Light" : "&#9790; Dark";
      });

      // Default path lookup
      function getDefaultPath(eventType) {
        const paths = {
          Login: "/api/auth/login",
          Logout: "/api/auth/logout",
          Consultation: "/api/records/view",
          Combination: "/api/records/merge",
          Alteration: "/api/records/update",
          Erasure: "/api/records/delete",
          AuthDenied: "/api/admin/access",
          SuspiciousInputDetected: "/api/records/search",
          HighRiskOperationInvolved: "/api/admin/config",
          HighVolumeDataAccess: "/api/records/export",
          BusinessRuleViolation: "/api/records/update",
          SuspiciousSlowRequest: "/api/records/report",
          UnexpectedHttpMethod: "/api/records/view",
          InternalError: "/api/records/process",
        };
        return paths[eventType] || "/api/unknown";
      }

      // API helper
      async function sendEvent(url, body) {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || `HTTP ${res.status}`);
        }
        return await res.json();
      }

      // Activity feed
      let events = [];
      const feedList = document.getElementById("feed-list");
      const feedCount = document.getElementById("feed-count");

      function addToFeed(category, eventType, severity, outcome, path) {
        const now = new Date();
        const time = now.toLocaleTimeString("en-GB", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
        const isSuccess = outcome === "Succeeded" || outcome === "Generated";
        const entry = {
          category,
          eventType,
          severity,
          outcome,
          path,
          time,
          timestamp: now.toISOString(),
        };
        events.unshift(entry);
        feedCount.textContent = `${events.length} event${events.length !== 1 ? "s" : ""}`;
        const div = document.createElement("div");
        div.className = `feed-item ${isSuccess ? "feed-success" : "feed-error"}`;
        div.innerHTML = `<div class="feed-row"><span class="feed-status ${isSuccess ? "status-success" : "status-error"}">${isSuccess ? "\u2713" : "\u2717"} ${category}: ${eventType}</span><span class="feed-time">${time}</span></div><div class="feed-detail">${severity} \u00b7 ${outcome} \u00b7 ${path}</div>`;
        feedList.prepend(div);
      }

      // Scenario buttons
      document.querySelectorAll(".scenario-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const { category, eventType, severity, outcome } = btn.dataset;
          const url =
            category === "Audit" ? "/api/events/audit" : "/api/events/security";
          btn.classList.add("sending");
          try {
            await sendEvent(url, { eventType, severity, outcome });
            addToFeed(
              category,
              eventType,
              severity,
              outcome,
              getDefaultPath(eventType),
            );
            btn.classList.add("sent");
            setTimeout(() => btn.classList.remove("sent"), 600);
          } catch (e) {
            addToFeed(
              category,
              eventType,
              severity,
              "Failed",
              getDefaultPath(eventType),
            );
          } finally {
            btn.classList.remove("sending");
          }
        });
      });

      // Bulk generate
      document
        .getElementById("bulk-btn")
        .addEventListener("click", async () => {
          const count =
            parseInt(document.getElementById("bulk-count").value) || 25;
          const btn = document.getElementById("bulk-btn");
          btn.classList.add("sending");
          try {
            const result = await sendEvent("/api/events/bulk", { count });
            addToFeed(
              "Bulk",
              `${result.count} events`,
              "Mixed",
              "Generated",
              "/api/events/bulk",
            );
          } catch (e) {
            addToFeed(
              "Bulk",
              `${count} events`,
              "Mixed",
              "Failed",
              "/api/events/bulk",
            );
          } finally {
            btn.classList.remove("sending");
          }
        });

      // Category toggle
      const categoryBtns = document.querySelectorAll(".category-btn");
      const eventTypeSelect = document.getElementById("event-type");
      categoryBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          categoryBtns.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          const cat = btn.dataset.value;
          eventTypeSelect.querySelectorAll("optgroup").forEach((g) => {
            g.style.display = g.dataset.category === cat ? "" : "none";
          });
          const first = eventTypeSelect.querySelector(
            `optgroup[data-category="${cat}"] option`,
          );
          if (first) eventTypeSelect.value = first.value;
        });
      });

      // Toggle groups (severity, outcome)
      document.querySelectorAll(".toggle-group").forEach((group) => {
        group.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            group
              .querySelectorAll("button")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
          });
        });
      });

      // Add custom property
      document.getElementById("add-prop").addEventListener("click", () => {
        const row = document.createElement("div");
        row.className = "prop-row";
        row.innerHTML =
          '<input type="text" placeholder="Key" class="prop-key"><input type="text" placeholder="Value" class="prop-value"><button class="prop-remove" onclick="this.parentElement.remove()">\u00d7</button>';
        document.getElementById("custom-props").appendChild(row);
      });

      // Send custom event
      document
        .getElementById("send-custom")
        .addEventListener("click", async () => {
          const category = document.querySelector(".category-btn.active")
            .dataset.value;
          const eventType = eventTypeSelect.value;
          const severity = document.querySelector("#severity-group .active")
            .dataset.value;
          const outcome = document.querySelector("#outcome-group .active")
            .dataset.value;
          const properties = {};
          document.querySelectorAll(".prop-row").forEach((row) => {
            const key = row.querySelector(".prop-key").value.trim();
            const val = row.querySelector(".prop-value").value.trim();
            if (key) properties[key] = val;
          });
          const url =
            category === "Audit" ? "/api/events/audit" : "/api/events/security";
          const reqBody = { eventType, severity, outcome };
          if (Object.keys(properties).length > 0)
            reqBody.properties = properties;
          const btn = document.getElementById("send-custom");
          btn.classList.add("sending");
          try {
            await sendEvent(url, reqBody);
            addToFeed(
              category,
              eventType,
              severity,
              outcome,
              getDefaultPath(eventType),
            );
          } catch (e) {
            addToFeed(
              category,
              eventType,
              severity,
              "Failed",
              getDefaultPath(eventType),
            );
          } finally {
            btn.classList.remove("sending");
          }
        });

      // Clear and export
      document.getElementById("clear-feed").addEventListener("click", () => {
        events = [];
        feedList.innerHTML = "";
        feedCount.textContent = "0 events";
      });

      document.getElementById("export-feed").addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(events, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `audit-events-${new Date().toISOString().slice(0, 19)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      });
    </script>
  </body>
</html>
